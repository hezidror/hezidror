story:
  title: "הסיפור מאחורי המספרה"
  background: assets/uploads/story-bg.jpg
  photo_top: assets/uploads/story-cut.jpg
  photo_top_alt: "חזי בזמן תספורת במספרה"
  photo_bottom: assets/uploads/story-comb.jpg
  photo_bottom_alt: "חזי מסרק ומעצב שיער של לקוחה"
  timeline:
    - year: "1994"
      label: "הצעדים הראשונים במספרה בתל אביב"
    - year: "2000"
      label: "הקמת המספרה"
    - year: "היום"
      label: "הדור השלישי של הלקוחות"
  sections:
    - heading: "איך הכל התחיל"
      text: |
        הסיפור שלי התחיל בשנת 1994, במספרה גדולה בלב תל אביב. במשך שש שנים של עבודה קשה עברתי שם את כל התחנות - התחלתי בחפיפות וסיימתי כמנהל המספרה. אז הרגשתי שהגיע הרגע להיות בעל הבית, וכך נולד המקום.

        בשנת 2000 הקמתי את המספרה, בצעדים קטנים ובטוחים. עם השנים קהל הלקוחות רק הלך וגדל, והיום אני כבר מספר את הדור השלישי של הלקוחות הראשונים שלי.
    - heading: "החזון שלי"
      text: "להמשיך להגשים חלומות בתחום השיער לכל לקוח ולקוחה - ולראות כל אחד ואחת יוצאים מהמספרה מחייכים ומאושרים."
    - heading: "מה מחכה לכם במספרה"
      text: "המספרה היא כמו סלון הבית - חמה, נעימה, והמקום הכי כיף להיפגש בו. כולם כאן משפחה אחת."
  highlights:
    - "שירות אישי ואדיב"
    - "יחס משפחתי ואווירה מיוחדת"
    - "תספורת, צבע ועיצוב שמותאמים במיוחד אליכם"
    - "ניסיון של למעלה מ-30 שנה בכל טיפול"
  promise_title: "ההבטחה האישית שלי"
  promise_text: "כל לקוח ולקוחה מקבלים ממני יחס אישי, הקשבה אמיתית והקפדה על כל פרט. אני לא מתפשר עד שהתוצאה מושלמת - ואתם יוצאים מהכיסא עם חיוך. כי אצלי אתם לא עוד לקוחות, אתם חלק מהמשפחה."
  promise_sign: "חזי דרור"

