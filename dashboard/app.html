<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#100e0c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="חזי מספרה">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="/static/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Frank+Ruhl+Libre:wght@700;900&display=swap">
  <title>חזי מספרה</title>
  <style>
    /* פלטת שחור-זהב, כמו האתר והלוגו */
    :root {
      --bg: #100e0c;
      --card: #1a1613;
      --surface: #221d18;
      --chip: #2a231d;
      --ink: #f4ecdf;
      --muted: #b9ac99;
      --accent: #e8bb5a;
      --accent-dark: #e8bb5a;
      --gold-grad: linear-gradient(135deg, #fbe7a9 0%, #e8bb5a 45%, #b8822c 100%);
      --on-accent: #1a1209;
      --line: #3a3128;
      --danger: #e07a6a;
      --ok: #7cc58f;
      --ok-bg: #1f3325;
      --font-head: "Frank Ruhl Libre", Georgia, serif;
      --font-body: "Assistant", "Segoe UI", Arial, sans-serif;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.5;
      min-height: 100vh;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    a { color: var(--accent); }
    header {
      background: var(--card);
      border-bottom: 1px solid var(--line);
      padding: calc(14px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 14px max(16px, env(safe-area-inset-left, 0px));
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    header h1 {
      margin: 0; font-family: var(--font-head); font-weight: 900; font-size: 24px;
      background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    header nav { display: flex; flex-wrap: wrap; gap: 8px; }
    header nav a {
      color: var(--ink);
      text-decoration: none;
      font-size: 15px;
      border: 1px solid var(--line);
      padding: 7px 12px;
      border-radius: 10px;
      background: var(--surface);
    }
    header nav a:hover { border-color: var(--accent); }
    main { max-width: 1100px; margin: 0 auto; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px)); }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
    }
    .flash {
      background: var(--ok-bg);
      border: 1px solid var(--ok);
      color: var(--ink);
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 16px;
    }
    .flash.err { background: transparent; border-color: var(--danger); color: var(--danger); }
    input, select, textarea, button { font-family: inherit; font-size: 16px; }
    input, select, textarea { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
    input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 2px;
    }
    button { color: var(--ink); }
    .btn-gold {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 12px 20px; border-radius: 12px; border: 0; background: var(--gold-grad);
      color: var(--on-accent); font-weight: 800; cursor: pointer; text-decoration: none;
    }
    .btn-ghost {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 11px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface);
      color: var(--ink); font-weight: 700; cursor: pointer; text-decoration: none;
    }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 600; }
    .muted { color: var(--muted); }
    footer { text-align: center; color: var(--muted); font-size: 12px; padding: 20px; }
    @media (max-width: 600px) { header nav a { padding: 6px 10px; font-size: 14px; } }
  </style>
  
<style>
  .app { max-width: 820px; margin: 0 auto; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 96px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 18px; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: env(safe-area-inset-top, 0px); }
  .top .brand small { display: block; color: var(--muted); font-size: 13px; letter-spacing: .06em; }
  .top h1 { margin: 0; font-family: var(--font-head); font-weight: 900; font-size: 28px; line-height: 1.1;
    background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .refresh { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); cursor: pointer; display: grid; place-items: center; }
  .refresh svg { width: 20px; height: 20px; }
  .refresh.spin svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .search { position: relative; }
  .search input { width: 100%; padding: 14px 16px; border-radius: 14px; font-size: 18px; }
  .results { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }

  .sec h2 { font-family: var(--font-head); font-size: 20px; margin: 0 0 10px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .sec h2 .muted { font-family: var(--font-body); font-size: 14px; font-weight: 400; }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .item { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 14px; align-items: center; padding: 12px 14px;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; text-decoration: none; color: var(--ink); }
  .item:hover { border-color: var(--accent); }
  .item .t { font-variant-numeric: tabular-nums; font-weight: 800; color: var(--accent); grid-row: span 2; min-width: 3.2em; }
  .item .n { font-weight: 700; font-size: 17px; min-width: 0; overflow-wrap: anywhere; }
  .item .s { color: var(--muted); font-size: 14px; min-width: 0; }
  .item .s bdi { font-variant-numeric: tabular-nums; }
  .item .b { grid-row: span 2; display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
  .item.fresh { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .tag { display: inline-block; font-size: 12px; font-weight: 800; padding: 3px 9px; border-radius: 999px; background: var(--chip); color: var(--muted); white-space: nowrap; }
  .tag.gold { background: var(--gold-grad); color: var(--on-accent); }
  .tag.ok { background: var(--ok-bg); color: var(--ok); }
  .tag.new { border: 1px solid var(--accent); color: var(--accent); background: transparent; }
  .empty { padding: 18px; border: 1.5px dashed var(--line); border-radius: 14px; color: var(--muted); text-align: center; }
  .note { font-size: 14px; color: var(--muted); }

  .tabbar { position: fixed; inset: auto 0 0 0; background: var(--card); border-top: 1px solid var(--line);
    display: grid; grid-template-columns: repeat(4, 1fr);
    padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); z-index: 5; }
  .tabbar a { display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--muted); text-decoration: none; font-size: 12px; font-weight: 700; padding: 6px 0; }
  .tabbar a.on { color: var(--accent); }
  .tabbar svg { width: 24px; height: 24px; }
</style>

</head>
<body>
  
<div class="app">
  <div class="top">
    <div class="brand"><small>חזי דרור · עיצוב שיער</small><h1>המספרה היום</h1></div>
    <button class="refresh" id="refresh" type="button" aria-label="רענון">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg>
    </button>
  </div>

  <div class="search">
    <input id="q" type="search" placeholder="חיפוש לקוח: שם או טלפון" autocomplete="off" aria-label="חיפוש לקוח">
    <div class="results" id="results"></div>
  </div>

  <section class="sec">
    <h2>הגיעו עכשיו <span class="muted" id="checkinCount"></span></h2>
    <div class="list" id="checkins"><div class="empty">טוען…</div></div>
    
  </section>

  <section class="sec">
    <h2>תורים היום <span class="muted" id="dayLabel"></span></h2>
    <div class="list" id="appts"><div class="empty">טוען…</div></div>
  </section>
</div>

<nav class="tabbar" aria-label="ניווט">
  <a href="/app" class="on">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>היום</a>
  <a href="/app/new">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10" cy="8" r="4"/><path d="M3 21a7 7 0 0 1 14 0M19 8v6M16 11h6"/></svg>לקוח חדש</a>
  <a href="/poster">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM20 14v7M14 20h3"/></svg>ברקוד</a>
  <a href="/">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>הכנסות</a>
</nav>

<script>
const DIRECTORY = [{"last": "20/11/26", "name": "\u05d3\u05e0\u05d4 \u05dc\u05d5\u05d9", "phone": "972501234567", "phone_display": "050-1234567", "url": "/clients/%D7%93%D7%A0%D7%94%20%D7%9C%D7%95%D7%99", "visits": 9}, {"last": "", "name": "\u05d9\u05d5\u05e1\u05d9 \u05db\u05d4\u05df", "phone": "972533334444", "phone_display": "053-3334444", "url": "/clients/%D7%99%D7%95%D7%A1%D7%99%20%D7%9B%D7%94%D7%9F", "visits": 0}, {"last": "", "name": "\u05de\u05d9\u05db\u05dc", "phone": "972521112222", "phone_display": "052-1112222", "url": "/clients/%D7%9E%D7%99%D7%9B%D7%9C", "visits": 0}];
const LOYALTY = 10;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const digits = (s) => String(s || "").replace(/\D/g, "");
const toIntl = (d) => d.startsWith("0") ? "972" + d.slice(1) : d;

// ---- search ----
$("q").addEventListener("input", () => {
  const q = $("q").value.trim();
  const box = $("results");
  if (q.length < 2) { box.innerHTML = ""; return; }
  const d = digits(q), low = q.toLowerCase();
  const hits = DIRECTORY.filter(c =>
    c.name.toLowerCase().includes(low) || (d.length >= 3 && (c.phone.includes(d) || c.phone.includes(toIntl(d))))
  ).slice(0, 12);
  if (!hits.length) {
    box.innerHTML = `<div class="empty">לא נמצא לקוח. <a href="/app/new?${d.length >= 9 ? "phone=" + encodeURIComponent(q) : "name=" + encodeURIComponent(q)}">הוספת לקוח חדש</a></div>`;
    return;
  }
  box.innerHTML = hits.map(c => {
    const st = LOYALTY ? c.visits % LOYALTY : null;
    const gift = LOYALTY && st === LOYALTY - 1;
    return `<a class="item" href="${esc(c.url)}">
      <span class="t">${LOYALTY ? st + "/" + LOYALTY : ""}</span>
      <span class="n">${esc(c.name)}</span>
      <span class="b">${gift ? '<span class="tag gold">הביקור הבא מתנה</span>' : ""}</span>
      <span class="s">${c.phone_display ? `<bdi dir="ltr">${esc(c.phone_display)}</bdi> · ` : ""}${c.visits} ביקורים${c.last ? " · אחרון " + esc(c.last) : ""}</span>
    </a>`;
  }).join("");
});

// ---- today ----
let lastCount = null;
async function loadToday(force) {
  $("refresh").classList.add("spin");
  try {
    const r = await fetch("/api/today" + (force ? "?refresh=1" : ""), { headers: { "Accept": "application/json" } });
    if (r.redirected || r.status === 401) { location.href = "/login?next=/app"; return; }
    const data = await r.json();
    $("dayLabel").textContent = data.date + (data.appointments.length ? ` · ${data.appointments.length} תורים` : "");
    $("checkinCount").textContent = data.checkins.length ? `· ${data.checkins.length} היום` : "";

    const fresh = lastCount !== null && data.checkins.length > lastCount ? data.checkins.length - lastCount : 0;
    lastCount = data.checkins.length;
    $("checkins").innerHTML = data.checkins.length ? data.checkins.map((c, i) => `
      <a class="item ${i < fresh ? "fresh" : ""}" href="${esc(c.url)}">
        <span class="t">${esc(c.time)}</span>
        <span class="n">${esc(c.name)}</span>
        <span class="b">${c.is_new ? '<span class="tag new">חדש/ה</span>' : ""}${c.next_is_gift ? '<span class="tag gold">ביקור מתנה</span>' : ""}</span>
        <span class="s"><bdi dir="ltr">${esc(c.phone_display)}</bdi>${!c.is_new && c.stamps !== null ? ` · כרטיסייה ${c.stamps}/${LOYALTY}` : ""}</span>
      </a>`).join("")
      : `<div class="empty">עוד אף אחד לא סרק את הברקוד היום. מי שיסרוק יופיע כאן מיד.</div>`;

    $("appts").innerHTML = data.appointments.length ? data.appointments.map(a => `
      <a class="item" href="${esc(a.url)}">
        <span class="t">${esc(a.time)}</span>
        <span class="n">${esc(a.name)}</span>
        <span class="b">${a.arrived ? '<span class="tag ok">הגיע/ה</span>' : ""}${a.gift ? '<span class="tag gold">מתנה</span>' : ""}</span>
        <span class="s">${esc(a.treatment)}${a.phone_display ? ` · <bdi dir="ltr">${esc(a.phone_display)}</bdi>` : ""}</span>
      </a>`).join("")
      : `<div class="empty">אין תורים ביומן להיום.</div>`;
    if (fresh && navigator.vibrate) navigator.vibrate(200);
  } catch (e) {
    $("checkins").innerHTML = `<div class="empty">לא הצלחתי לטעון. בדקו את החיבור ולחצו על כפתור הרענון.</div>`;
  } finally {
    $("refresh").classList.remove("spin");
  }
}
$("refresh").addEventListener("click", () => loadToday(true));
loadToday(false);
// כל 30 שניות בודקים אם מישהו סרק (קריאה קלה מהקאש; הצ'ק-אין עצמו מעדכן את הקאש מיד)
setInterval(() => { if (!document.hidden) loadToday(false); }, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) loadToday(false); });
</script>

  <script>
    if ("serviceWorker" in navigator) { navigator.serviceWorker.register("/sw.js").catch(() => {}); }
  </script>
</body>
</html>
