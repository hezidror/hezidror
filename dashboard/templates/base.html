<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#100e0c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="חזי מספרה">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='icon-192.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Frank+Ruhl+Libre:wght@700;900&display=swap">
  <title>{% block title %}חזי דרור - מספרה{% endblock %}</title>
  <style>
    /* פלטת שחור-זהב, כמו האתר והלוגו */
    :root {
      --bg: #100e0c;
      --card: #1a1613;
      --surface: #221d18;
      --chip: #2a231d;
      --ink: #f4ecdf;
      --muted: #b9ac99;
      --accent: #e8bb5a;
      --accent-dark: #e8bb5a;
      --gold-grad: linear-gradient(135deg, #fbe7a9 0%, #e8bb5a 45%, #b8822c 100%);
      --on-accent: #1a1209;
      --line: #3a3128;
      --danger: #e07a6a;
      --ok: #7cc58f;
      --ok-bg: #1f3325;
      --font-head: "Frank Ruhl Libre", Georgia, serif;
      --font-body: "Assistant", "Segoe UI", Arial, sans-serif;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.5;
      min-height: 100vh;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    a { color: var(--accent); }
    header {
      background: var(--card);
      border-bottom: 1px solid var(--line);
      padding: calc(14px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 14px max(16px, env(safe-area-inset-left, 0px));
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    header h1 {
      margin: 0; font-family: var(--font-head); font-weight: 900; font-size: 24px;
      background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    header nav { display: flex; flex-wrap: wrap; gap: 8px; }
    header nav a {
      color: var(--ink);
      text-decoration: none;
      font-size: 15px;
      border: 1px solid var(--line);
      padding: 7px 12px;
      border-radius: 10px;
      background: var(--surface);
    }
    header nav a:hover { border-color: var(--accent); }
    main { max-width: 1100px; margin: 0 auto; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px)); }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
    }
    .flash {
      background: var(--ok-bg);
      border: 1px solid var(--ok);
      color: var(--ink);
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 16px;
    }
    .flash.err { background: transparent; border-color: var(--danger); color: var(--danger); }
    input, select, textarea, button { font-family: inherit; font-size: 16px; }
    input, select, textarea { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
    input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 2px;
    }
    button { color: var(--ink); }
    .btn-gold {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 12px 20px; border-radius: 12px; border: 0; background: var(--gold-grad);
      color: var(--on-accent); font-weight: 800; cursor: pointer; text-decoration: none;
    }
    .btn-ghost {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 11px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface);
      color: var(--ink); font-weight: 700; cursor: pointer; text-decoration: none;
    }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 600; }
    .muted { color: var(--muted); }
    footer { text-align: center; color: var(--muted); font-size: 12px; padding: 20px; }
    @media (max-width: 600px) { header nav a { padding: 6px 10px; font-size: 14px; } }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}
  {% if session.get("authed") %}
  <script src="{{ url_for('static', filename='live.js') }}" data-mode="{{ 'card' if request.endpoint == 'client_card' else 'app' }}"></script>
  {% endif %}
  <script>
    if ("serviceWorker" in navigator) { navigator.serviceWorker.register("/sw.js").catch(() => {}); }
  </script>
</body>
</html>
